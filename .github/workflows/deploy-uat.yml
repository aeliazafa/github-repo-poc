name: Deploy to UAT

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy-uat:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    environment:
      name: uat

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.event.workflow_run.head_sha }}
          path: dist/

      - name: Simulate UAT deployment
        run: |
          echo "Deploying artifact app-${{ github.event.workflow_run.head_sha }} to UAT"
          ls -la dist/
          echo "POC: add real deployment command here"
